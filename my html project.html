<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .form-row {
            display: flex;
            gap: 20px;
        }

        .form-group {
            width: 50%;
            margin-bottom: 20px;
        }

        .full {
            width: 100%;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102,126,234,0.3);
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .gender {
            display: flex;
            gap: 25px;
            margin-top: 10px;
        }

        .gender label {
            font-weight: normal;
        }

        .gender input {
            width: auto;
            margin-right: 5px;
        }

        .terms {
            margin: 10px 0 20px;
        }

        .terms input {
            width: auto;
            margin-right: 8px;
        }

        .terms label {
            display: inline;
            font-weight: normal;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        @media (max-width: 650px) {
            .form-row {
                flex-direction: column;
                gap: 0;
            }

            .form-group {
                width: 100%;
            }

            .container {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Registration Form</h1>
        <p class="subtitle">Please fill in the details below</p>

        <form>

            <!-- Name & Email -->
            <div class="form-row">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input 
                        type="text" 
                        id="name" 
                        placeholder="Enter your full name"
                        required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        placeholder="Enter your email"
                        required>
                </div>

            </div>

            <!-- Phone & DOB -->
            <div class="form-row">

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input 
                        type="tel" 
                        id="phone" 
                        placeholder="Enter phone number"
                        required>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input 
                        type="date" 
                        id="dob"
                        required>
                </div>

            </div>

            <!-- Gender -->
            <div class="form-group full">

                <label>Gender</label>

                <div class="gender">

                    <label>
                        <input type="radio" name="gender" value="male">
                        Male
                    </label>

                    <label>
                        <input type="radio" name="gender" value="female">
                        Female
                    </label>

                    <label>
                        <input type="radio" name="gender" value="other">
                        Other
                    </label>

                </div>

            </div>

            <!-- Course & State -->
            <div class="form-row">

                <div class="form-group">

                    <label for="course">Select Course</label>

                    <select id="course" required>

                        <option value="">-- Select Course --</option>
                        <option value="btech">B.Tech</option>
                        <option value="bca">BCA</option>
                        <option value="mca">MCA</option>
                        <option value="bsc">B.Sc</option>
                        <option value="msc">M.Sc</option>
                        <option value="other">Other</option>

                    </select>

                </div>

                <div class="form-group">

                    <label for="state">State</label>

                    <select id="state" required>

                        <option value="">-- Select State --</option>
                        <option>Uttar Pradesh</option>
                        <option>Delhi</option>
                        <option>Bihar</option>
                        <option>Maharashtra</option>
                        <option>Rajasthan</option>
                        <option>Madhya Pradesh</option>
                        <option>Gujarat</option>
                        <option>Other</option>

                    </select>

                </div>

            </div>

            <!-- City -->
            <div class="form-group full">

                <label for="city">City</label>

                <input 
                    type="text" 
                    id="city" 
                    placeholder="Enter your city"
                    required>

            </div>

            <!-- Address -->
            <div class="form-group full">

                <label for="address">Address</label>

                <textarea 
                    id="address" 
                    placeholder="Enter your complete address"
                    required></textarea>

            </div>

            <!-- Password -->
            <div class="form-row">

                <div class="form-group">

                    <label for="password">Password</label>

                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Create password"
                        required>

                </div>

                <div class="form-group">

                    <label for="confirmPassword">Confirm Password</label>

                    <input 
                        type="password" 
                        id="confirmPassword" 
                        placeholder="Confirm password"
                        required>

                </div>

            </div>

            <!-- Terms -->
            <div class="terms">

                <input type="checkbox" id="terms" required>

                <label for="terms">
                    I agree to the Terms & Conditions
                </label>

            </div>

            <!-- Submit -->
            <button type="submit">
                Submit Registration
            </button>

        </form>

    </div>

</body>
</html>
